# docs/demo/laptop.tmux.conf — the laptop's own tmux, for tabs.gif.
#
# Appended to what `cx bar --setup` prints (the tape writes both into the
# laptop's ~/.tmux.conf, which lives in the demo volume): the tab and status
# lines themselves are cx's, unchanged. What is here is only presentation.

# Every shell tmux starts is the demo shell: prompt, cx on PATH, completion.
set -g default-command "bash --rcfile /cx/docs/demo/demorc"
set -g default-terminal "tmux-256color"
set -sg escape-time 10

# The tab bar at the TOP. Each tab holds a session on a server, and that
# server's tmux draws its own bar at the bottom of the pane: two bars at the
# bottom, one above the other, is hard to tell apart in a GIF.
set -g status-position top
set -g status-style "bg=colour237,fg=colour250"
set -g status-left ""
setw -g window-status-separator ""

# The only change to cx's own lines: redraw every 2 seconds rather than 10, so
# the icons change while the recording is still on them. setup's comment says
# where the interval belongs, and this is that knob.
set -g status-interval 2
