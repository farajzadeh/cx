name: Release binaries

# The cx web server, built for every platform install.sh fetches it on, and
# attached to the GitHub Release with a SHA256SUMS that install.sh checks
# each download against. The release itself is made by hand
# (gh release create, see CLAUDE.md); this only fills it in.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  web:
    name: cx-web binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        working-directory: web
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ver="${TAG#v}"
          # A binary that says it is another version than bin/cx would be
          # refused by cx web, so check before shipping one.
          grep -q "^CX_VERSION=\"$ver\"$" ../bin/cx || { echo "bin/cx is not $ver"; exit 1; }
          mkdir -p ../dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}" arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$ver" -o "../dist/cx-web-$os-$arch" .
          done
          cd ../dist && sha256sum cx-web-* >SHA256SUMS && cat SHA256SUMS

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
