name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck and shfmt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          curl -fsSL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_linux_amd64
          sudo chmod +x /usr/local/bin/shfmt

      # Catches bash-4 and GNU-only constructs that work on the developer's
      # machine and break for macOS users.
      - name: Portability lint
        run: ./test/lint-portability.sh

      - name: shellcheck
        run: |
          find . -path ./.git -prune -o -type f \
            \( -name '*.sh' -o -name 'cx' -o -name 'cx-agent' \) -print0 |
            xargs -0 shellcheck -x -e SC1091 -S warning

      - name: shfmt
        run: |
          find . -path ./.git -prune -o -type f \
            \( -name '*.sh' -o -name 'cx' -o -name 'cx-agent' \) -print0 |
            xargs -0 shfmt -d -i 2 -ci

  unit:
    name: Unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is not redundant: it ships bash 3.2 and BSD userland,
        # which is the environment this project's portability rules exist for.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew list jq >/dev/null 2>&1 || brew install jq
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq jq
          fi

      - name: Report the interpreter under test
        run: bash --version | head -1

      - name: Unit tests
        run: ./test/run.sh

  bash32:
    name: Unit under bash 3.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Belt and braces alongside the macOS job: this pins the exact
      # interpreter version rather than whatever the runner image ships.
      - name: Unit tests in a bash 3.2 container
        run: |
          for t in test/unit/*.test.sh; do
            echo "== $t"
            docker run --rm -v "$PWD":/w -w /w bash:3.2 bash "$t"
          done

  integration:
    name: Integration (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      # Runs against real sshd containers with real key auth. Claude Code is
      # stubbed, so no credentials and no Anthropic network access are needed.
      - name: Integration tests
        run: |
          for t in test/integration/*.test.sh; do
            echo "== $t"
            bash "$t"
          done
